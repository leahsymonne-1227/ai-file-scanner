<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Document Scanner LLC </title>
    <link rel="stylesheet" href="document_scanner_ui.css">
</head>

<body>
    <nav class="nav-list-small">
        <a href="document_scanner_ui.html" class="active" id="link-new"> New Upload </a>
        <a href="#" id="link-existing"> Existing Upload </a>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
            crossorigin="anonymous"></script>
    </nav>
    <script>
        // this would normally be in a separate file. leaving it here for visibilit
        const newUploadLink = document.getElementById('link-new');
        const existingUploadLink = document.getElementById('link-existing');

        existingUploadLink.addEventListener('click', function (event) {
            event.preventDefault();
            existingUploadLink.classList.add('active');
            newUploadLink.classList.remove('active');
        });

        newUploadLink.addEventListener('click', function (event) {
            event.preventDefault();
            existingUploadLink.classList.remove('active');
            newUploadLink.classList.add('active');
        });

    </script>
</body>

</html>
